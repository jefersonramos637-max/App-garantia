<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Garantias · sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f6f7f6;
        color: #1c2321;
      }
      .caixa {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2e7e4;
        border-radius: 14px;
        padding: 2rem 1.75rem;
        text-align: center;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        color: #5b6663;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.65rem 1.4rem;
        border-radius: 10px;
        background: #1d5c3a;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 1rem;
        color: #8a9491;
      }
    </style>
  </head>
  <body>
    <div class="caixa">
      <svg width="56" height="56" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="104" fill="#1d5c3a" />
        <path d="M256 88 392 140v104c0 92-58 160-136 184-78-24-136-92-136-184V140z" fill="#ffffff" />
        <path d="M190 262l46 46 92-100" fill="none" stroke="#1d5c3a" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Sem conexão com o sistema</h1>
      <p>Verifique a internet deste computador. O aplicativo tenta conectar de novo sozinho.</p>
      <a id="tentar" href="#">Tentar novamente</a>
      <small id="contagem"></small>
    </div>
    <script>
      const destino = new URLSearchParams(location.search).get('destino')
      const botao = document.getElementById('tentar')
      const contagem = document.getElementById('contagem')
      function tentar() {
        if (destino && /^https?:\/\//.test(destino)) location.href = destino
      }
      botao.addEventListener('click', (e) => {
        e.preventDefault()
        tentar()
      })
      window.addEventListener('online', tentar)
      let segundos = 20
      setInterval(() => {
        segundos -= 1
        contagem.textContent = segundos > 0 ? 'Nova tentativa em ' + segundos + ' s' : 'Tentando…'
        if (segundos <= 0) {
          segundos = 20
          tentar()
        }
      }, 1000)
    </script>
  </body>
</html>
