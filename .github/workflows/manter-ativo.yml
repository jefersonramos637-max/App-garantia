# O plano gratuito do Supabase pausa projetos sem uso por 7 dias.
# Este agendamento faz uma consulta simples (sem dados) a cada 2 dias para manter o projeto ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '41 14 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Enviar sinal de atividade
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Cadastre os segredos SUPABASE_URL e SUPABASE_ANON_KEY (veja o README)."
            exit 0
          fi
          resposta=$(curl -sS --fail-with-body --max-time 30 -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Resposta: $resposta"
          test "$resposta" = '"ok"'
